<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Dr Dhiaa Al Awadhy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;800&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-soft: #E6D18A; --dark: #1A1A18;
    --ink: #24231F; --muted: #706D61; --cream: #F5F0E8;
    --paper: #FFFCF4; --green: #2D6A4F; --line: rgba(26,26,24,0.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink);
         font-family: "Source Sans 3", sans-serif; line-height: 1.55; }
  a { color: inherit; }

  /* TOPBAR */
  .topbar { position: sticky; top: 0; z-index: 10;
            background: rgba(26,26,24,0.96);
            border-bottom: 1px solid rgba(201,168,76,0.35); color: var(--cream); }
  .topbar-inner { max-width: 1180px; margin: 0 auto;
                  padding: 14px clamp(18px,4vw,36px);
                  display: flex; align-items: center;
                  justify-content: space-between; gap: 18px; }
  .brand { font-family: "Playfair Display", serif; font-weight: 800;
           color: var(--gold-soft); text-decoration: none; white-space: nowrap; }
  [lang="ar"] .brand { font-family: "Cairo", sans-serif; }
  .navlinks { display: flex; gap: 18px; align-items: center;
              flex-wrap: wrap; justify-content: flex-end; }
  .navlinks a { color: rgba(245,240,232,0.75); font-size: 13px;
                letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
  .navlinks a:hover { color: var(--gold-soft); }
  .lang-switcher { display: flex; gap: 2px; margin-left: 12px; }
  [dir="rtl"] .lang-switcher { margin-left: 0; margin-right: 12px; }
  .lang-btn { background: transparent; border: 1px solid transparent;
               color: rgba(245,240,232,0.45); font-size: 11px; padding: 5px 9px;
               cursor: pointer; text-transform: uppercase; border-radius: 2px;
               line-height: 1; font-family: inherit; }
  .lang-btn:hover { color: var(--gold-soft); }
  .lang-btn.active { color: var(--gold-soft); border-color: rgba(201,168,76,0.4);
                     background: rgba(201,168,76,0.1); }

  /* CHAT LAYOUT */
  .chat-page { max-width: 780px; margin: 0 auto;
               padding: 36px clamp(18px,4vw,36px) 80px;
               display: flex; flex-direction: column; height: calc(100vh - 60px); }
  .chat-messages { flex: 1; overflow-y: auto; display: flex;
                   flex-direction: column; gap: 14px; padding-bottom: 12px; }
  .chat-msg { max-width: 80%; padding: 12px 16px;
              font-size: 0.97rem; line-height: 1.6; }
  .chat-msg--user { align-self: flex-end; background: var(--dark);
                    color: var(--cream); border-radius: 2px; }
  .chat-msg--bot { align-self: flex-start; background: var(--paper);
                   border: 1px solid var(--line); border-radius: 2px; }
  .chat-disclaimer { font-size: 0.82rem; color: var(--muted); margin: 8px 0 0; }
  .chat-error { color: #9B2335; }
  .chat-video-row { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 0 4px; }
  .chat-video-card { display: block; background: var(--paper);
                     border: 1px solid var(--line); padding: 10px 14px;
                     text-decoration: none; color: var(--ink); min-width: 180px;
                     max-width: 220px; flex-shrink: 0; }
  .chat-video-card:hover { border-color: var(--gold); }
  .chat-video-title { display: block; font-family: "Cairo", sans-serif;
                      font-weight: 700; font-size: 0.9rem; line-height: 1.4; }
  .chat-video-meta { display: block; font-size: 0.78rem; color: var(--muted);
                     margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }

  /* CHAT INPUT */
  .chat-form { display: flex; gap: 10px; border-top: 1px solid var(--line);
               padding-top: 14px; margin-top: 14px; }
  .chat-input { flex: 1; min-height: 48px; border: 1px solid var(--dark);
                background: var(--paper); color: var(--ink); font: inherit;
                font-size: 1rem; padding: 12px 14px; outline: none; resize: none; }
  .chat-input:focus { box-shadow: 0 0 0 3px rgba(201,168,76,0.28); }
  .chat-send { background: var(--dark); color: var(--gold-soft);
               border: none; padding: 12px 20px; cursor: pointer;
               font: inherit; font-size: 0.9rem; font-weight: 700;
               letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .chat-send:hover { background: #2c2c28; }

  /* ── V2 response elements ───────────────────────────────────────────── */
  .chat-v2-label {
    display: block; font-family: "Cairo", sans-serif; font-size: 0.78rem;
    color: var(--muted); direction: rtl; text-align: right;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(201,168,76,0.25);
  }
  .chat-v2-quote {
    direction: rtl; text-align: right; margin: 0 0 12px;
    padding: 10px 14px 10px 10px;
    font-family: "Cairo", sans-serif; font-size: 0.97rem; line-height: 1.8;
    background: rgba(201,168,76,0.07);
    border-right: 3px solid var(--gold); color: var(--ink);
  }
  .chat-v2-yt {
    display: flex; align-items: center; gap: 10px;
    background: var(--dark); color: var(--gold-soft); text-decoration: none;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .chat-v2-yt:hover { background: #2c2c28; }
  .chat-v2-yt-icon { width: 18px; height: 18px; fill: var(--gold-soft); flex-shrink: 0; }
  .chat-v2-yt-info { flex: 1; min-width: 0; direction: rtl; text-align: right; }
  .chat-v2-yt-title { display: block; font-family: "Cairo", sans-serif; font-weight: 700;
    font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-v2-yt-ts { display: block; font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }
  .chat-v2-yt-cta { font-size: 0.8rem; letter-spacing: 0.07em; flex-shrink: 0; white-space: nowrap; }
  .chat-v2-more { margin-bottom: 6px; }
  .chat-v2-more summary {
    font-size: 0.82rem; color: var(--muted); cursor: pointer; padding: 4px 0;
    list-style: none; direction: rtl; user-select: none;
  }
  .chat-v2-more summary::-webkit-details-marker { display: none; }
  .chat-v2-more-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--ink); direction: rtl;
  }
  .chat-v2-more-item:last-child { border-bottom: none; }
  .chat-v2-more-title { font-family: "Cairo", sans-serif; font-size: 0.88rem; font-weight: 600;
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-v2-more-ts { font-size: 0.78rem; color: var(--muted); flex-shrink: 0; }

  @media (max-width: 620px) {
    .topbar-inner { flex-direction: column; align-items: flex-start; }
    .navlinks { justify-content: flex-start; }
    .chat-msg { max-width: 95%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" data-i18n="brand">Le Système Tayyibat</a>
    <nav class="navlinks">
      <a href="index.html" data-i18n="nav_home">Accueil</a>
      <a href="videos.html" data-i18n="nav_videos">Vidéos</a>
      <a href="chat.html" data-i18n="nav_chat">Chat</a>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ar">AR</button>
      </div>
    </nav>
  </div>
</header>

<main class="chat-page">
  <div class="chat-messages" id="messages"></div>
  <form class="chat-form" id="form">
    <textarea class="chat-input" id="input" rows="1"
              placeholder="Posez votre question de santé..."></textarea>
    <button class="chat-send" type="submit" id="send-btn">Envoyer</button>
  </form>
</main>

<script type="module">
import { fetchChatV2, escapeHtml, t, getLang } from './chat-core.js';

const YT_ICON = `<svg class="chat-v2-yt-icon" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 00.5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/>
</svg>`;

const DISCLAIMER = `<p class="chat-disclaimer" dir="rtl">⚠ هذه المعلومات تعليمية ولا تغني عن استشارة طبيب متخصص.</p>`;

function renderV2(data) {
  const el = document.createElement('div');
  el.className = 'chat-msg chat-msg--bot';

  if (!data || data.mode === 'v2_rate_limited') {
    el.innerHTML = `<p dir="rtl" style="font-family:Cairo,sans-serif;margin:0 0 6px">${escapeHtml(data?.answer || 'يرجى التمهل.')}</p>${DISCLAIMER}`;
    return el;
  }
  // Phase Finale: handle both legacy v2_no_result and new v3_no_result.
  if (data.mode === 'v2_no_result' || data.mode === 'v3_no_result') {
    el.innerHTML = `<p dir="rtl" style="font-family:Cairo,sans-serif;margin:0 0 6px">${escapeHtml(data.answer || 'لم أجد مقطعاً واضحاً من كلام الدكتور ضياء حول هذا السؤال.')}</p>${DISCLAIMER}`;
    return el;
  }

  const sources = data.sources || [];
  const main = sources[0] || {};
  const rest = sources.slice(1);

  const quote = escapeHtml((main.quote || '').slice(0, 300));
  const title = escapeHtml((main.title || main.id || '').slice(0, 55));
  const ts    = escapeHtml(main.timestamp || '');
  const url   = escapeHtml(main.url || '#');

  // Phase Finale db_resume 3-couches : object {verdict, simple, explanation?}
  const dbResume  = (data.db_resume && typeof data.db_resume === 'object') ? data.db_resume : null;
  const dbSimple  = dbResume?.simple || '';
  const dbExplain = dbResume?.explanation || '';

  // Composed-dish prefix (worker prepends to data.answer when principal canonical missing)
  const answerFirstLine = (data.answer || '').split('\n')[0] || '';
  const composedPrefix  = answerFirstLine.startsWith('لم أجد كلاماً مباشراً') ? answerFirstLine : '';

  // Main content: prefer db_resume.simple > raw quote
  let mainContent;
  if (dbSimple) {
    const prefixHtml = composedPrefix
      ? `<p class="chat-v2-prefix" dir="rtl" style="font-style:italic;color:#666;font-size:0.92em;margin:0 0 10px">${escapeHtml(composedPrefix)}</p>`
      : '';
    mainContent = `${prefixHtml}<p class="chat-v2-summary" dir="rtl" style="font-family:Cairo,sans-serif;line-height:1.6">${escapeHtml(dbSimple)}</p>`;
  } else if (quote) {
    mainContent = `<blockquote class="chat-v2-quote">"${quote}…"</blockquote>`;
  } else {
    mainContent = `<p dir="rtl" style="font-family:Cairo,sans-serif">${escapeHtml(data.answer || '')}</p>`;
  }

  // Layer 2 (optional): pedagogic explanation, collapsible
  const explanationHtml = dbExplain
    ? `<details class="chat-v2-more">
        <summary>▾ شرح أكثر</summary>
        <p dir="rtl" style="font-family:Cairo,sans-serif;padding:8px;background:#f8f8f8;border-radius:6px;margin:6px 0">${escapeHtml(dbExplain)}</p>
      </details>`
    : '';

  // Layer 3: raw Dr quote, collapsible if we showed dbSimple. Otherwise quote is already main.
  const transcriptHtml = (dbSimple && quote)
    ? `<details class="chat-v2-more">
        <summary>🗣 كلام الدكتور الأصلي</summary>
        <blockquote class="chat-v2-quote">"${quote}…"</blockquote>
      </details>`
    : '';

  const moreHtml = rest.length > 0
    ? `<details class="chat-v2-more">
        <summary>▾ مصادر أخرى (${rest.length})</summary>
        ${rest.map(s => `
          <a class="chat-v2-more-item" href="${escapeHtml(s.url || '#')}" target="_blank" rel="noopener">
            <span class="chat-v2-more-title">${escapeHtml((s.title || '').slice(0, 50))}</span>
            <span class="chat-v2-more-ts">⏱ ${escapeHtml(s.timestamp || '')}</span>
          </a>`).join('')}
      </details>`
    : '';

  el.innerHTML = `
    <span class="chat-v2-label">🎤 بحسب كلام الدكتور ضياء العوضي</span>
    ${mainContent}
    <a class="chat-v2-yt" href="${url}" target="_blank" rel="noopener">
      ${YT_ICON}
      <span class="chat-v2-yt-info">
        <span class="chat-v2-yt-title">${title}</span>
        <span class="chat-v2-yt-ts">⏱ ${ts}</span>
      </span>
      <span class="chat-v2-yt-cta">شاهد ▶</span>
    </a>
    ${explanationHtml}
    ${transcriptHtml}
    ${moreHtml}
    ${DISCLAIMER}`;

  return el;
}

const I18N_PAGE = {
  fr: { brand: 'Le Système Tayyibat', nav_home: 'Accueil', nav_videos: 'Vidéos', nav_chat: 'Chat',
        meta_title: 'Chat — Dr Dhiaa Al Awadhy' },
  en: { brand: 'The Tayyibat System', nav_home: 'Home', nav_videos: 'Videos', nav_chat: 'Chat',
        meta_title: 'Chat — Dr Dhiaa Al Awadhy' },
  ar: { brand: 'نظام الطيبات', nav_home: 'الرئيسية', nav_videos: 'الفيديوهات', nav_chat: 'المحادثة',
        meta_title: 'المحادثة — د. ضياء العوضي' }
};

function applyLang(lang) {
  localStorage.setItem('lang', lang);
  const tr = I18N_PAGE[lang] || I18N_PAGE.fr;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = tr.meta_title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = tr[el.dataset.i18n];
    if (val) el.textContent = val;
  });
  document.getElementById('input').placeholder = t('placeholder');
  document.getElementById('send-btn').textContent = t('send');
  document.querySelectorAll('.lang-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.lang === lang));
}

function init() {
  const lang = getLang();
  applyLang(lang);

  const msgs = document.getElementById('messages');
  const welcome = document.createElement('div');
  welcome.className = 'chat-msg chat-msg--bot welcome-msg';
  welcome.textContent = t('welcome');
  msgs.appendChild(welcome);
  const reply = document.createElement('p');
  reply.className = 'chat-disclaimer reply-disclaimer';
  reply.textContent = t('reply_note');
  msgs.appendChild(reply);

  document.querySelectorAll('.lang-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      applyLang(btn.dataset.lang);
      const w = document.querySelector('.welcome-msg');
      if (w) w.textContent = t('welcome');
      const r = document.querySelector('.reply-disclaimer');
      if (r) r.textContent = t('reply_note');
    }));

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const input  = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const question = input.value.trim();
    if (!question) return;
    input.value = '';
    input.style.height = '';
    input.disabled = true;
    sendBtn.disabled = true;

    const userEl = document.createElement('div');
    userEl.className = 'chat-msg chat-msg--user';
    userEl.innerHTML = `<span dir="rtl">${escapeHtml(question)}</span>`;
    msgs.appendChild(userEl);

    const thinking = document.createElement('div');
    thinking.className = 'chat-msg chat-msg--bot';
    thinking.innerHTML = `<em>${t('thinking')}</em>`;
    msgs.appendChild(thinking);
    msgs.scrollTop = msgs.scrollHeight;

    let data;
    try {
      data = await fetchChatV2(question);
    } catch {
      thinking.innerHTML = `<span class="chat-error">${t('error_generic')}</span>`;
      input.disabled = false;
      sendBtn.disabled = false;
      return;
    }

    thinking.replaceWith(renderV2(data));
    msgs.scrollTop = msgs.scrollHeight;
    input.disabled = false;
    sendBtn.disabled = false;
  });

  document.getElementById('input').addEventListener('input', function() {
    this.style.height = '';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('form').requestSubmit();
    }
  });
}

init();
</script>
</body>
</html>
