<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Système Tayyibat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --dark: #1A1A18; --dark-2: #2C2C28; --cream: #F5F0E8;
    --text: #1A1A18; --text-muted: #6B6B60; --danger: #B33A3A; --ok: #2E7D5B;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--cream); color: var(--text); margin: 0; padding: 0; }
  header { background: var(--dark); color: var(--cream); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header h1 { font-family: 'Cairo', serif; font-weight: 700; font-size: 20px; margin: 0; color: var(--gold); }
  header nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header nav button { background: transparent; color: var(--cream); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  header nav button:hover { background: var(--gold); color: var(--dark); }
  header nav button.active { background: var(--gold); color: var(--dark); }
  main { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
  .login-card { max-width: 400px; margin: 60px auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .login-card h2 { margin-top: 0; color: var(--dark); font-family: 'Cairo', serif; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
  input, textarea, select {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit;
  }
  button.primary { background: var(--gold); color: var(--dark); border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 15px; }
  button.primary:hover { background: var(--dark); color: var(--gold); }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hidden { display: none !important; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: white; border-radius: 8px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal h2 { margin-top: 0; font-family: 'Cairo', serif; }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; display: inline-block; margin-right: 4px; }
  .badge.platform { background: var(--dark); color: var(--cream); }
  .badge.valide { background: var(--ok); color: white; }
  .badge.pas_valide { background: var(--danger); color: white; }
  .card { background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: transform .1s; }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
  .card-body { padding: 12px; }
  .card-title { font-size: 14px; line-height: 1.3; margin-top: 6px; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
  table th { background: var(--dark); color: var(--cream); padding: 10px; text-align: left; }
  table td { padding: 10px; border-bottom: 1px solid #eee; }
  button.icon { background: none; border: none; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 6px; }
  button.danger { background: var(--danger); color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.danger:hover { opacity: 0.85; }
  button.subtle { background: none; border: 1px solid #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Tayyibat Admin</h1>
  <nav id="nav" class="hidden">
    <button data-view="videos" class="active">Vidéos témoignages</button>
    <button data-view="whitelist">Whitelist /videos</button>
    <button data-view="users" id="nav-users">Utilisateurs</button>
    <button data-view="analytics" id="nav-analytics">Analytics</button>
    <span id="user-info" style="font-size: 13px; color: var(--cream);"></span>
    <button id="logout-btn">Déconnexion</button>
  </nav>
</header>

<main>
  <div id="login-view" class="login-card">
    <h2>Connexion</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="primary" style="width: 100%; margin-top: 16px;">Se connecter</button>
      <div class="error" id="login-error"></div>
    </form>
  </div>

  <div id="videos-view" class="hidden"></div>
  <div id="whitelist-view" class="hidden"></div>
  <div id="users-view" class="hidden"></div>
  <div id="analytics-view" class="hidden"></div>
</main>

<script type="module">
  const API_BASE = 'https://tayyibat-admin.houcemben.workers.dev';
  let currentUser = null;
  let videosState = { items: [], total: 0, page: 1, per_page: 30, filters: {} };

  async function api(method, path, body) {
    const opts = {
      method, credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(`${API_BASE}${path}`, opts);
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error(txt || `HTTP ${r.status}`);
    }
    if (r.status === 204) return null;
    return r.json();
  }

  function showLogin() {
    currentUser = null;
    document.getElementById('nav').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('videos-view').classList.add('hidden');
    document.getElementById('users-view').classList.add('hidden');
  }
  function showApp(user) {
    currentUser = user;
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('nav').classList.remove('hidden');
    document.getElementById('user-info').textContent = `${user.role} • uid ${user.uid}`;
    document.getElementById('nav-users').style.display = user.role === 'admin' ? '' : 'none';
    document.getElementById('nav-analytics').style.display = user.role === 'admin' ? '' : 'none';
    showView('videos');
  }
  function showView(name) {
    for (const v of ['videos', 'whitelist', 'users', 'analytics']) {
      document.getElementById(`${v}-view`).classList.toggle('hidden', v !== name);
    }
    for (const b of document.querySelectorAll('#nav button[data-view]')) {
      b.classList.toggle('active', b.dataset.view === name);
    }
    if (name === 'videos') loadVideos();
    else if (name === 'whitelist') loadWhitelist();
    else if (name === 'users') loadUsers();
    else if (name === 'analytics') loadAnalytics();
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('login-error');
    err.textContent = '';
    try {
      const user = await api('POST', '/api/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      showApp(user);
    } catch (e) {
      err.textContent = e.message === 'unauthorized' ? 'Identifiants invalides.' : e.message;
    }
  });
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await api('POST', '/api/logout').catch(() => {});
    showLogin();
  });
  for (const b of document.querySelectorAll('#nav button[data-view]')) {
    b.addEventListener('click', () => showView(b.dataset.view));
  }

  // --- Videos view ---
  async function loadVideos() {
    const params = new URLSearchParams();
    params.set('page', videosState.page);
    params.set('per_page', videosState.per_page);
    for (const [k, v] of Object.entries(videosState.filters)) {
      if (v) params.set(k, v);
    }
    const j = await api('GET', `/api/videos?${params}`);
    videosState.items = j.items;
    videosState.total = j.total;
    renderVideos();
  }

  function renderVideos() {
    const v = document.getElementById('videos-view');
    v.innerHTML = `
      <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center;">
        <input type="text" id="search-input" placeholder="Rechercher titre/URL..." style="flex:1; min-width:200px;">
        <select id="status-filter" style="width:auto;">
          <option value="">Tous statuts</option>
          <option value="valide">Validé</option>
          <option value="pas_valide">Pas validé</option>
        </select>
        <select id="platform-filter" style="width:auto;">
          <option value="">Toutes plateformes</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
        </select>
        <button class="primary" id="add-video-btn">+ Ajouter vidéo</button>
      </div>
      <p style="color:var(--text-muted)">Total : ${videosState.total} vidéo(s)</p>
      <div id="video-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;"></div>
      <div id="pagination" style="text-align:center; margin-top:24px;"></div>
    `;

    document.getElementById('search-input').value = videosState.filters.q || '';
    document.getElementById('status-filter').value = videosState.filters.status || '';
    document.getElementById('platform-filter').value = videosState.filters.platform || '';

    const grid = document.getElementById('video-grid');
    for (const item of videosState.items) {
      const card = document.createElement('article');
      card.className = 'card';
      const img = item.thumbnail_url
        ? `<img src="${item.thumbnail_url}" alt="" loading="lazy">`
        : `<div style="aspect-ratio:16/9; background:#eee; display:flex; align-items:center; justify-content:center; color:#aaa;">${item.platform}</div>`;
      card.innerHTML = `${img}<div class="card-body"><div><span class="badge platform">${item.platform}</span><span class="badge ${item.status}">${item.status === 'valide' ? 'validé' : 'pas validé'}</span></div><div class="card-title"></div></div>`;
      card.querySelector('.card-title').textContent = item.title || '(sans titre)';
      card.addEventListener('click', () => openVideoDetail(item.id));
      grid.appendChild(card);
    }

    const totalPages = Math.max(1, Math.ceil(videosState.total / videosState.per_page));
    document.getElementById('pagination').innerHTML = totalPages > 1
      ? `Page ${videosState.page}/${totalPages} <button class="subtle" id="prev" ${videosState.page <= 1 ? 'disabled' : ''}>‹</button> <button class="subtle" id="next" ${videosState.page >= totalPages ? 'disabled' : ''}>›</button>`
      : '';

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { videosState.filters.q = e.target.value; videosState.page = 1; loadVideos(); }, 250);
    });
    document.getElementById('status-filter').addEventListener('change', (e) => {
      videosState.filters.status = e.target.value; videosState.page = 1; loadVideos();
    });
    document.getElementById('platform-filter').addEventListener('change', (e) => {
      videosState.filters.platform = e.target.value; videosState.page = 1; loadVideos();
    });
    document.getElementById('add-video-btn').addEventListener('click', openAddVideoModal);
    document.getElementById('prev')?.addEventListener('click', () => { videosState.page--; loadVideos(); });
    document.getElementById('next')?.addEventListener('click', () => { videosState.page++; loadVideos(); });
  }

  async function openVideoDetail(id) {
    const { video, history } = await api('GET', `/api/videos/${id}`);
    const isAdmin = currentUser?.role === 'admin';
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:16px;">
          <h2 style="margin:0;"></h2>
          <button class="icon" id="close-modal" aria-label="Fermer">×</button>
        </div>
        <div id="embed-container" style="aspect-ratio:16/9; background:#000; margin-bottom:16px;"></div>
        <p style="font-size:13px; color:var(--text-muted);">
          Plateforme : <strong>${video.platform}</strong> ·
          <a href="${video.url}" target="_blank" rel="noopener">Voir source</a>
        </p>
        <label for="note-input">Note (optionnel, max 2000 caractères)</label>
        <textarea id="note-input" rows="3" maxlength="2000"></textarea>
        <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
          <button class="primary" id="toggle-status" style="flex:1; min-width:160px;">
            ${video.status === 'valide' ? '✗ Marquer pas validé' : '✓ Marquer validé'}
          </button>
          ${isAdmin ? `<button class="danger" id="delete-video">Supprimer</button>` : ''}
        </div>
        <h3 style="margin-top:24px; font-size:14px; text-transform:uppercase; color:var(--text-muted);">Historique</h3>
        <ul id="history-list" style="list-style:none; padding:0; font-size:13px;"></ul>
      </div>
    `;
    bg.querySelector('h2').textContent = video.title || '(sans titre)';
    bg.querySelector('#note-input').value = video.note || '';

    const emb = bg.querySelector('#embed-container');
    if (video.platform === 'youtube') {
      emb.innerHTML = `<iframe width="100%" height="100%" src="${video.embed_url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>`;
    } else if (video.platform === 'tiktok') {
      emb.style.background = 'white';
      emb.innerHTML = `<blockquote class="tiktok-embed" cite="${video.url}" style="margin:0;"><a href="${video.url}" target="_blank">Voir sur TikTok</a></blockquote>`;
      if (!document.getElementById('tiktok-script')) {
        const s = document.createElement('script'); s.id = 'tiktok-script'; s.src = 'https://www.tiktok.com/embed.js'; document.body.appendChild(s);
      }
    } else if (video.platform === 'instagram') {
      emb.style.background = 'white';
      emb.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${video.url}" style="margin:0;"><a href="${video.url}" target="_blank">Voir sur Instagram</a></blockquote>`;
      if (!document.getElementById('ig-script')) {
        const s = document.createElement('script'); s.id = 'ig-script'; s.src = 'https://www.instagram.com/embed.js'; document.body.appendChild(s);
      }
    } else if (video.platform === 'facebook') {
      emb.innerHTML = `<iframe width="100%" height="100%" src="${video.embed_url}" allowfullscreen frameborder="0"></iframe>`;
    }

    const ul = bg.querySelector('#history-list');
    for (const h of history) {
      const li = document.createElement('li');
      li.style.cssText = 'padding:6px 0; border-bottom:1px solid #eee;';
      const who = h.user_name || '(utilisateur supprimé)';
      const noteStr = h.note ? ` — « ${h.note} »` : '';
      const statusStr = h.new_status && h.new_status !== h.previous_status ? ` → ${h.new_status}` : '';
      li.textContent = `[${h.created_at}] ${who} — ${h.action}${statusStr}${noteStr}`;
      ul.appendChild(li);
    }

    bg.querySelector('#close-modal').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });

    bg.querySelector('#toggle-status').addEventListener('click', async () => {
      const newStatus = video.status === 'valide' ? 'pas_valide' : 'valide';
      const note = bg.querySelector('#note-input').value;
      try {
        await api('PATCH', `/api/videos/${id}`, { status: newStatus, note: note || undefined });
        bg.remove();
        loadVideos();
      } catch (e) { alert(`Erreur : ${e.message}`); }
    });

    if (isAdmin) {
      bg.querySelector('#delete-video').addEventListener('click', async () => {
        if (!confirm('Supprimer définitivement cette vidéo ?')) return;
        try {
          await api('DELETE', `/api/videos/${id}`);
          bg.remove();
          loadVideos();
        } catch (e) { alert(`Erreur : ${e.message}`); }
      });
    }

    document.body.appendChild(bg);
  }

  function openAddVideoModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Ajouter une vidéo</h2>
        <p style="font-size:13px; color:var(--text-muted);">YouTube, TikTok, Instagram (Reel/Post), Facebook</p>
        <label for="add-url">URL</label>
        <input type="url" id="add-url" placeholder="https://...">
        <button class="primary" id="submit-add" style="margin-top:12px; width:100%;">Ajouter</button>
        <div class="error" id="add-error"></div>
        <button class="subtle" id="cancel-add" style="width:100%; margin-top:8px;">Annuler</button>
      </div>
    `;
    document.body.appendChild(bg);
    const input = bg.querySelector('#add-url');
    input.focus();
    bg.querySelector('#cancel-add').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    bg.querySelector('#submit-add').addEventListener('click', async () => {
      const url = input.value.trim();
      if (!url) return;
      const err = bg.querySelector('#add-error');
      err.textContent = '';
      try {
        await api('POST', '/api/videos', { url });
        bg.remove();
        videosState.page = 1;
        videosState.filters.status = 'pas_valide';
        loadVideos();
      } catch (e) { err.textContent = e.message; }
    });
  }

  // --- Whitelist view ---
  let whitelistState = { items: [], filter: '' };

  async function loadWhitelist() {
    const j = await api('GET', '/api/whitelist');
    whitelistState.items = j.items;
    renderWhitelist();
  }

  function renderWhitelist() {
    const v = document.getElementById('whitelist-view');
    const isAdmin = currentUser?.role === 'admin';
    const filter = whitelistState.filter.toLowerCase();
    const filtered = filter
      ? whitelistState.items.filter(x => (x.external_id || '').toLowerCase().includes(filter) || (x.title || '').toLowerCase().includes(filter))
      : whitelistState.items;

    const pending = whitelistState.items.filter(x => !x.approved).length;
    const approved = whitelistState.items.length - pending;
    v.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-family:Cairo,serif; margin:0;">Whitelist /videos</h2>
        ${isAdmin ? `<button class="primary" id="add-wl-btn">+ Ajouter une vidéo</button>` : ''}
      </div>
      <p style="color:var(--text-muted); font-size:14px;">
        <strong style="color:var(--ok)">${approved} approuvées</strong> (visibles sur <a href="/videos" target="_blank">/videos</a>) ·
        <strong style="color:var(--danger)">${pending} en attente</strong> (visibles ici seulement, à valider).
        Délai cache CDN public : ~60s après changement.
      </p>
      <input type="text" id="wl-search" placeholder="Filtrer par ID ou titre..." value="${filter}" style="margin-bottom:16px;">
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Statut</th><th>ID YouTube</th><th>Titre</th><th>Aperçu</th><th>Ajouté par</th><th>Date</th>${isAdmin ? '<th>Actions</th>' : ''}</tr></thead>
        <tbody id="wl-tbody"></tbody>
      </table></div>
      <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">${filtered.length} résultat(s) affichés (en attente d'abord).</p>
    `;

    document.getElementById('wl-search').addEventListener('input', (e) => {
      whitelistState.filter = e.target.value;
      renderWhitelistRows(isAdmin);
    });
    renderWhitelistRows(isAdmin);
    if (isAdmin) document.getElementById('add-wl-btn').addEventListener('click', openAddWhitelistModal);
  }

  function renderWhitelistRows(isAdmin) {
    const filter = whitelistState.filter.toLowerCase();
    const filtered = filter
      ? whitelistState.items.filter(x => (x.external_id || '').toLowerCase().includes(filter) || (x.title || '').toLowerCase().includes(filter))
      : whitelistState.items;
    const tbody = document.getElementById('wl-tbody');
    tbody.innerHTML = '';
    for (const item of filtered.slice(0, 200)) {
      const isApproved = !!item.approved;
      const tr = document.createElement('tr');
      const statusCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (isApproved ? 'valide' : 'pas_valide');
      badge.textContent = isApproved ? 'approuvée' : 'en attente';
      statusCell.appendChild(badge);
      const idCell = document.createElement('td');
      const idCode = document.createElement('code');
      idCode.style.fontSize = '12px';
      idCode.textContent = item.external_id;
      idCell.appendChild(idCode);
      const titleCell = document.createElement('td');
      titleCell.textContent = item.title || '—';
      titleCell.style.maxWidth = '260px';
      titleCell.style.overflow = 'hidden';
      titleCell.style.textOverflow = 'ellipsis';
      titleCell.style.whiteSpace = 'nowrap';
      const thumbCell = document.createElement('td');
      const thumb = document.createElement('img');
      thumb.src = `https://img.youtube.com/vi/${item.external_id}/default.jpg`;
      thumb.style.cssText = 'width:80px; height:45px; object-fit:cover; display:block;';
      thumb.loading = 'lazy';
      const link = document.createElement('a');
      link.href = `https://www.youtube.com/watch?v=${item.external_id}`;
      link.target = '_blank';
      link.rel = 'noopener';
      link.appendChild(thumb);
      thumbCell.appendChild(link);
      const userCell = document.createElement('td');
      userCell.textContent = item.added_by_email || '—';
      userCell.style.fontSize = '12px';
      const dateCell = document.createElement('td');
      dateCell.textContent = (item.added_at || '').split(' ')[0] || '—';
      dateCell.style.fontSize = '12px';
      tr.appendChild(statusCell);
      tr.appendChild(idCell);
      tr.appendChild(titleCell);
      tr.appendChild(thumbCell);
      tr.appendChild(userCell);
      tr.appendChild(dateCell);
      if (isAdmin) {
        const actionsCell = document.createElement('td');
        const toggle = document.createElement('button');
        toggle.className = isApproved ? 'subtle' : 'primary';
        toggle.style.fontSize = '13px';
        toggle.style.padding = '6px 12px';
        toggle.textContent = isApproved ? '✗ Mettre en attente' : '✓ Approuver';
        toggle.addEventListener('click', async () => {
          try {
            await api('PATCH', `/api/whitelist/${encodeURIComponent(item.external_id)}`, { approved: !isApproved });
            loadWhitelist();
          } catch (e) { alert(e.message); }
        });
        actionsCell.appendChild(toggle);
        const del = document.createElement('button');
        del.className = 'danger';
        del.textContent = 'Supprimer';
        del.style.marginLeft = '6px';
        del.addEventListener('click', async () => {
          if (!confirm(`Supprimer définitivement ${item.external_id} de la whitelist ?`)) return;
          try {
            await api('DELETE', `/api/whitelist/${encodeURIComponent(item.external_id)}`);
            loadWhitelist();
          } catch (e) { alert(e.message); }
        });
        actionsCell.appendChild(del);
        tr.appendChild(actionsCell);
      }
      tbody.appendChild(tr);
    }
  }

  function openAddWhitelistModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Ajouter à la whitelist /videos</h2>
        <p style="font-size:13px; color:var(--text-muted);">Colle une URL YouTube ou un ID. La vidéo apparaîtra sur /videos sous 60s.</p>
        <label for="wl-input">URL ou ID YouTube</label>
        <input type="text" id="wl-input" placeholder="https://www.youtube.com/watch?v=... ou Jgc1oVhmczI">
        <label for="wl-title">Titre (optionnel)</label>
        <input type="text" id="wl-title" placeholder="Pour t'y retrouver dans la liste">
        <button class="primary" id="wl-submit" style="margin-top:12px; width:100%;">Ajouter</button>
        <div class="error" id="wl-err"></div>
        <button class="subtle" id="wl-cancel" style="width:100%; margin-top:8px;">Annuler</button>
      </div>
    `;
    document.body.appendChild(bg);
    const input = bg.querySelector('#wl-input');
    input.focus();
    bg.querySelector('#wl-cancel').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    bg.querySelector('#wl-submit').addEventListener('click', async () => {
      const err = bg.querySelector('#wl-err'); err.textContent = '';
      try {
        await api('POST', '/api/whitelist', {
          url: input.value.trim(),
          title: bg.querySelector('#wl-title').value.trim() || undefined
        });
        bg.remove(); loadWhitelist();
      } catch (e) { err.textContent = e.message; }
    });
  }

  // --- Users view ---
  async function loadUsers() {
    const j = await api('GET', '/api/users');
    const v = document.getElementById('users-view');
    v.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-family:Cairo,serif; margin:0;">Utilisateurs (${j.items.length})</h2>
        <button class="primary" id="add-user-btn">+ Ajouter vérificateur</button>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Email</th><th>Nom</th><th>Rôle</th><th>Dernière connexion</th><th>Actif</th><th>Actions</th></tr></thead>
        <tbody id="user-tbody"></tbody>
      </table></div>
    `;
    const tbody = document.getElementById('user-tbody');
    for (const u of j.items) {
      const tr = document.createElement('tr');
      const isSelf = u.id === currentUser?.uid;
      const cells = [
        u.email, u.display_name, u.role,
        u.last_login_at || '—', u.active ? '✓' : '✗',
        isSelf ? '(vous)' : ''
      ];
      cells.forEach((c, i) => {
        const td = document.createElement('td');
        if (i < 5) td.textContent = c;
        tr.appendChild(td);
      });
      const actionsTd = tr.lastChild;
      if (!isSelf) {
        const toggle = document.createElement('button');
        toggle.className = 'subtle';
        toggle.textContent = u.active ? 'Désactiver' : 'Réactiver';
        toggle.addEventListener('click', async () => {
          await api('PATCH', `/api/users/${u.id}`, { active: !u.active });
          loadUsers();
        });
        actionsTd.appendChild(toggle);
        const del = document.createElement('button');
        del.className = 'danger';
        del.textContent = 'Supprimer';
        del.style.marginLeft = '6px';
        del.addEventListener('click', async () => {
          if (!confirm(`Supprimer définitivement ${u.email} ?`)) return;
          try { await api('DELETE', `/api/users/${u.id}`); loadUsers(); }
          catch (e) { alert(e.message); }
        });
        actionsTd.appendChild(del);
      } else {
        actionsTd.textContent = '(vous)';
      }
      tbody.appendChild(tr);
    }
    document.getElementById('add-user-btn').addEventListener('click', openAddUserModal);
  }

  function openAddUserModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Ajouter un vérificateur</h2>
        <label>Email <input type="email" id="u-email" required></label>
        <label>Nom <input type="text" id="u-name" required></label>
        <label>Mot de passe (min 8 caractères) <input type="password" id="u-pw" required minlength="8"></label>
        <button class="primary" id="u-submit" style="margin-top:12px; width:100%;">Créer</button>
        <div class="error" id="u-err"></div>
        <button class="subtle" id="u-cancel" style="width:100%; margin-top:8px;">Annuler</button>
      </div>
    `;
    document.body.appendChild(bg);
    bg.querySelector('#u-cancel').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    bg.querySelector('#u-submit').addEventListener('click', async () => {
      const err = bg.querySelector('#u-err'); err.textContent = '';
      try {
        await api('POST', '/api/users', {
          email: bg.querySelector('#u-email').value,
          display_name: bg.querySelector('#u-name').value,
          password: bg.querySelector('#u-pw').value,
          role: 'verificateur'
        });
        bg.remove(); loadUsers();
      } catch (e) { err.textContent = e.message; }
    });
  }

  // --- Analytics view ---
  function flagEmoji(cc) {
    if (!cc || cc.length !== 2) return '🌐';
    const A = 0x1F1E6;
    return String.fromCodePoint(A + cc.toUpperCase().charCodeAt(0) - 65)
         + String.fromCodePoint(A + cc.toUpperCase().charCodeAt(1) - 65);
  }

  function fmtDuration(ms) {
    if (!ms || ms < 0) return '—';
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + 'm' + (r < 10 ? '0' + r : r);
  }

  let analyticsState = { data: null, recentPage: 1, perPage: 50, filter: '' };

  async function loadAnalytics() {
    const v = document.getElementById('analytics-view');
    v.innerHTML = '<p style="color:var(--text-muted)">Chargement…</p>';
    try {
      const data = await api('GET', '/api/analytics');
      analyticsState.data = data;
      renderAnalytics();
    } catch (e) {
      v.innerHTML = `<p style="color:var(--danger)">Erreur : ${e.message}</p>`;
    }
  }

  function renderAnalytics() {
    const v = document.getElementById('analytics-view');
    const d = analyticsState.data;
    if (!d) return;
    const s = d.summary;
    const topCountry = d.top_countries[0];

    const filter = analyticsState.filter.toLowerCase();
    const filtered = filter
      ? d.recent.filter(r =>
          (r.ip || '').includes(filter)
          || (r.country || '').toLowerCase().includes(filter)
          || (r.page_path || '').toLowerCase().includes(filter))
      : d.recent;
    const totalPages = Math.max(1, Math.ceil(filtered.length / analyticsState.perPage));
    if (analyticsState.recentPage > totalPages) analyticsState.recentPage = 1;
    const start = (analyticsState.recentPage - 1) * analyticsState.perPage;
    const pageRows = filtered.slice(start, start + analyticsState.perPage);

    v.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-family:Cairo,serif; margin:0;">Analytics (30 derniers jours)</h2>
        <button class="subtle" id="refresh-analytics">🔄 Rafraîchir</button>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:32px;">
        ${[
          ['Visiteurs uniques', s.unique_ips],
          ['Visites totales', s.total_views_30d],
          ['Questions chatbot', s.chatbot_questions_30d],
          ['Durée moyenne / page', fmtDuration(s.avg_duration_ms)],
          ['Pays #1', topCountry ? (flagEmoji(topCountry.country) + ' ' + topCountry.country) : '—']
        ].map(([label, val]) => `
          <div style="background:white; padding:18px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.06);">
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-muted)">${label}</div>
            <div style="font-size:1.6rem; font-weight:700; margin-top:4px; color:var(--dark)">${val}</div>
          </div>
        `).join('')}
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px; margin-bottom:32px;">
        <div>
          <h3 style="font-family:Cairo,serif; font-size:14px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-muted)">Top 10 pays</h3>
          <ul style="list-style:none; padding:0; margin:0;">
            ${d.top_countries.map(c => `
              <li style="padding:8px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                <span>${flagEmoji(c.country)} ${c.country}</span>
                <strong>${c.n}</strong>
              </li>
            `).join('') || '<li style="color:var(--text-muted)">Aucune donnée</li>'}
          </ul>
        </div>
        <div>
          <h3 style="font-family:Cairo,serif; font-size:14px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-muted)">Top 10 pages</h3>
          <ul style="list-style:none; padding:0; margin:0;">
            ${d.top_pages.map(p => `
              <li style="padding:8px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                <code style="font-size:12px;">${p.page_path}</code>
                <strong>${p.n}</strong>
              </li>
            `).join('') || '<li style="color:var(--text-muted)">Aucune donnée</li>'}
          </ul>
        </div>
      </div>

      <h3 style="font-family:Cairo,serif; margin-bottom:8px;">Dernières visites</h3>
      <input type="text" id="recent-filter" placeholder="Filtrer par IP, pays ou page…" value="${filter}" style="margin-bottom:12px;">
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Temps</th><th>IP</th><th>Pays</th><th>Page</th><th>Durée</th><th>Lang</th><th>Chat?</th></tr></thead>
        <tbody>
          ${pageRows.map(r => `
            <tr>
              <td style="font-size:12px;">${(r.ts || '').replace('T', ' ').substring(0, 19)}</td>
              <td style="font-family:monospace; font-size:12px;">${r.ip}</td>
              <td>${r.country ? (flagEmoji(r.country) + ' ' + r.country) : '—'}</td>
              <td><code style="font-size:12px;">${r.page_path}</code></td>
              <td style="font-size:12px;">${fmtDuration(r.duration_ms)}</td>
              <td style="font-size:12px;">${r.lang || '—'}</td>
              <td style="font-size:12px;">${r.is_chatbot_question ? '💬' : ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table></div>
      <div style="margin-top:12px; text-align:center;">
        Page ${analyticsState.recentPage}/${totalPages}
        <button class="subtle" id="ana-prev" ${analyticsState.recentPage <= 1 ? 'disabled' : ''}>‹</button>
        <button class="subtle" id="ana-next" ${analyticsState.recentPage >= totalPages ? 'disabled' : ''}>›</button>
      </div>
    `;

    document.getElementById('refresh-analytics').addEventListener('click', loadAnalytics);
    let filterTimer;
    document.getElementById('recent-filter').addEventListener('input', e => {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        analyticsState.filter = e.target.value;
        analyticsState.recentPage = 1;
        renderAnalytics();
      }, 200);
    });
    document.getElementById('ana-prev').addEventListener('click', () => { analyticsState.recentPage--; renderAnalytics(); });
    document.getElementById('ana-next').addEventListener('click', () => { analyticsState.recentPage++; renderAnalytics(); });
  }

  // Auto-detect existing session
  api('GET', '/api/videos?per_page=1')
    .then(() => showApp({ uid: '?', role: 'admin' }))
    .catch(() => showLogin());
</script>
</body>
</html>
