<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Système Tayyibat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --dark: #1A1A18; --dark-2: #2C2C28; --cream: #F5F0E8;
    --text: #1A1A18; --text-muted: #6B6B60; --danger: #B33A3A; --ok: #2E7D5B;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--cream); color: var(--text); margin: 0; padding: 0; }
  header { background: var(--dark); color: var(--cream); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header h1 { font-family: 'Cairo', serif; font-weight: 700; font-size: 20px; margin: 0; color: var(--gold); }
  header nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header nav button { background: transparent; color: var(--cream); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  header nav button:hover { background: var(--gold); color: var(--dark); }
  header nav button.active { background: var(--gold); color: var(--dark); }
  main { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
  .login-card { max-width: 400px; margin: 60px auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .login-card h2 { margin-top: 0; color: var(--dark); font-family: 'Cairo', serif; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
  input, textarea, select {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit;
  }
  button.primary { background: var(--gold); color: var(--dark); border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 15px; }
  button.primary:hover { background: var(--dark); color: var(--gold); }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hidden { display: none !important; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: white; border-radius: 8px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal h2 { margin-top: 0; font-family: 'Cairo', serif; }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; display: inline-block; margin-right: 4px; }
  .badge.platform { background: var(--dark); color: var(--cream); }
  .badge.valide { background: var(--ok); color: white; }
  .badge.pas_valide { background: var(--danger); color: white; }
  .card { background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: transform .1s; }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
  .card-body { padding: 12px; }
  .card-title { font-size: 14px; line-height: 1.3; margin-top: 6px; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
  table th { background: var(--dark); color: var(--cream); padding: 10px; text-align: left; }
  table td { padding: 10px; border-bottom: 1px solid #eee; }
  button.icon { background: none; border: none; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 6px; }
  button.danger { background: var(--danger); color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.danger:hover { opacity: 0.85; }
  button.subtle { background: none; border: 1px solid #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Tayyibat Admin</h1>
  <nav id="nav" class="hidden">
    <button data-view="videos" class="active">Vidéos</button>
    <button data-view="users" id="nav-users">Utilisateurs</button>
    <span id="user-info" style="font-size: 13px; color: var(--cream);"></span>
    <button id="logout-btn">Déconnexion</button>
  </nav>
</header>

<main>
  <div id="login-view" class="login-card">
    <h2>Connexion</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="primary" style="width: 100%; margin-top: 16px;">Se connecter</button>
      <div class="error" id="login-error"></div>
    </form>
  </div>

  <div id="videos-view" class="hidden"></div>
  <div id="users-view" class="hidden"></div>
</main>

<script type="module">
  const API_BASE = 'https://tayyibat-admin.houcemben.workers.dev';
  let currentUser = null;
  let videosState = { items: [], total: 0, page: 1, per_page: 30, filters: {} };

  async function api(method, path, body) {
    const opts = {
      method, credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(`${API_BASE}${path}`, opts);
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error(txt || `HTTP ${r.status}`);
    }
    if (r.status === 204) return null;
    return r.json();
  }

  function showLogin() {
    currentUser = null;
    document.getElementById('nav').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('videos-view').classList.add('hidden');
    document.getElementById('users-view').classList.add('hidden');
  }
  function showApp(user) {
    currentUser = user;
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('nav').classList.remove('hidden');
    document.getElementById('user-info').textContent = `${user.role} • uid ${user.uid}`;
    document.getElementById('nav-users').style.display = user.role === 'admin' ? '' : 'none';
    showView('videos');
  }
  function showView(name) {
    for (const v of ['videos', 'users']) {
      document.getElementById(`${v}-view`).classList.toggle('hidden', v !== name);
    }
    for (const b of document.querySelectorAll('#nav button[data-view]')) {
      b.classList.toggle('active', b.dataset.view === name);
    }
    if (name === 'videos') loadVideos();
    else if (name === 'users') loadUsers();
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('login-error');
    err.textContent = '';
    try {
      const user = await api('POST', '/api/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      showApp(user);
    } catch (e) {
      err.textContent = e.message === 'unauthorized' ? 'Identifiants invalides.' : e.message;
    }
  });
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await api('POST', '/api/logout').catch(() => {});
    showLogin();
  });
  for (const b of document.querySelectorAll('#nav button[data-view]')) {
    b.addEventListener('click', () => showView(b.dataset.view));
  }

  // --- Videos view ---
  async function loadVideos() {
    const params = new URLSearchParams();
    params.set('page', videosState.page);
    params.set('per_page', videosState.per_page);
    for (const [k, v] of Object.entries(videosState.filters)) {
      if (v) params.set(k, v);
    }
    const j = await api('GET', `/api/videos?${params}`);
    videosState.items = j.items;
    videosState.total = j.total;
    renderVideos();
  }

  function renderVideos() {
    const v = document.getElementById('videos-view');
    v.innerHTML = `
      <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center;">
        <input type="text" id="search-input" placeholder="Rechercher titre/URL..." style="flex:1; min-width:200px;">
        <select id="status-filter" style="width:auto;">
          <option value="">Tous statuts</option>
          <option value="valide">Validé</option>
          <option value="pas_valide">Pas validé</option>
        </select>
        <select id="platform-filter" style="width:auto;">
          <option value="">Toutes plateformes</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
        </select>
        <button class="primary" id="add-video-btn">+ Ajouter vidéo</button>
      </div>
      <p style="color:var(--text-muted)">Total : ${videosState.total} vidéo(s)</p>
      <div id="video-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;"></div>
      <div id="pagination" style="text-align:center; margin-top:24px;"></div>
    `;

    document.getElementById('search-input').value = videosState.filters.q || '';
    document.getElementById('status-filter').value = videosState.filters.status || '';
    document.getElementById('platform-filter').value = videosState.filters.platform || '';

    const grid = document.getElementById('video-grid');
    for (const item of videosState.items) {
      const card = document.createElement('article');
      card.className = 'card';
      const img = item.thumbnail_url
        ? `<img src="${item.thumbnail_url}" alt="" loading="lazy">`
        : `<div style="aspect-ratio:16/9; background:#eee; display:flex; align-items:center; justify-content:center; color:#aaa;">${item.platform}</div>`;
      card.innerHTML = `${img}<div class="card-body"><div><span class="badge platform">${item.platform}</span><span class="badge ${item.status}">${item.status === 'valide' ? 'validé' : 'pas validé'}</span></div><div class="card-title"></div></div>`;
      card.querySelector('.card-title').textContent = item.title || '(sans titre)';
      card.addEventListener('click', () => openVideoDetail(item.id));
      grid.appendChild(card);
    }

    const totalPages = Math.max(1, Math.ceil(videosState.total / videosState.per_page));
    document.getElementById('pagination').innerHTML = totalPages > 1
      ? `Page ${videosState.page}/${totalPages} <button class="subtle" id="prev" ${videosState.page <= 1 ? 'disabled' : ''}>‹</button> <button class="subtle" id="next" ${videosState.page >= totalPages ? 'disabled' : ''}>›</button>`
      : '';

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { videosState.filters.q = e.target.value; videosState.page = 1; loadVideos(); }, 250);
    });
    document.getElementById('status-filter').addEventListener('change', (e) => {
      videosState.filters.status = e.target.value; videosState.page = 1; loadVideos();
    });
    document.getElementById('platform-filter').addEventListener('change', (e) => {
      videosState.filters.platform = e.target.value; videosState.page = 1; loadVideos();
    });
    document.getElementById('add-video-btn').addEventListener('click', openAddVideoModal);
    document.getElementById('prev')?.addEventListener('click', () => { videosState.page--; loadVideos(); });
    document.getElementById('next')?.addEventListener('click', () => { videosState.page++; loadVideos(); });
  }

  async function openVideoDetail(id) {
    const { video, history } = await api('GET', `/api/videos/${id}`);
    const isAdmin = currentUser?.role === 'admin';
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:16px;">
          <h2 style="margin:0;"></h2>
          <button class="icon" id="close-modal" aria-label="Fermer">×</button>
        </div>
        <div id="embed-container" style="aspect-ratio:16/9; background:#000; margin-bottom:16px;"></div>
        <p style="font-size:13px; color:var(--text-muted);">
          Plateforme : <strong>${video.platform}</strong> ·
          <a href="${video.url}" target="_blank" rel="noopener">Voir source</a>
        </p>
        <label for="note-input">Note (optionnel, max 2000 caractères)</label>
        <textarea id="note-input" rows="3" maxlength="2000"></textarea>
        <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
          <button class="primary" id="toggle-status" style="flex:1; min-width:160px;">
            ${video.status === 'valide' ? '✗ Marquer pas validé' : '✓ Marquer validé'}
          </button>
          ${isAdmin ? `<button class="danger" id="delete-video">Supprimer</button>` : ''}
        </div>
        <h3 style="margin-top:24px; font-size:14px; text-transform:uppercase; color:var(--text-muted);">Historique</h3>
        <ul id="history-list" style="list-style:none; padding:0; font-size:13px;"></ul>
      </div>
    `;
    bg.querySelector('h2').textContent = video.title || '(sans titre)';
    bg.querySelector('#note-input').value = video.note || '';

    const emb = bg.querySelector('#embed-container');
    if (video.platform === 'youtube') {
      emb.innerHTML = `<iframe width="100%" height="100%" src="${video.embed_url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>`;
    } else if (video.platform === 'tiktok') {
      emb.style.background = 'white';
      emb.innerHTML = `<blockquote class="tiktok-embed" cite="${video.url}" style="margin:0;"><a href="${video.url}" target="_blank">Voir sur TikTok</a></blockquote>`;
      if (!document.getElementById('tiktok-script')) {
        const s = document.createElement('script'); s.id = 'tiktok-script'; s.src = 'https://www.tiktok.com/embed.js'; document.body.appendChild(s);
      }
    } else if (video.platform === 'instagram') {
      emb.style.background = 'white';
      emb.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${video.url}" style="margin:0;"><a href="${video.url}" target="_blank">Voir sur Instagram</a></blockquote>`;
      if (!document.getElementById('ig-script')) {
        const s = document.createElement('script'); s.id = 'ig-script'; s.src = 'https://www.instagram.com/embed.js'; document.body.appendChild(s);
      }
    } else if (video.platform === 'facebook') {
      emb.innerHTML = `<iframe width="100%" height="100%" src="${video.embed_url}" allowfullscreen frameborder="0"></iframe>`;
    }

    const ul = bg.querySelector('#history-list');
    for (const h of history) {
      const li = document.createElement('li');
      li.style.cssText = 'padding:6px 0; border-bottom:1px solid #eee;';
      const who = h.user_name || '(utilisateur supprimé)';
      const noteStr = h.note ? ` — « ${h.note} »` : '';
      const statusStr = h.new_status && h.new_status !== h.previous_status ? ` → ${h.new_status}` : '';
      li.textContent = `[${h.created_at}] ${who} — ${h.action}${statusStr}${noteStr}`;
      ul.appendChild(li);
    }

    bg.querySelector('#close-modal').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });

    bg.querySelector('#toggle-status').addEventListener('click', async () => {
      const newStatus = video.status === 'valide' ? 'pas_valide' : 'valide';
      const note = bg.querySelector('#note-input').value;
      try {
        await api('PATCH', `/api/videos/${id}`, { status: newStatus, note: note || undefined });
        bg.remove();
        loadVideos();
      } catch (e) { alert(`Erreur : ${e.message}`); }
    });

    if (isAdmin) {
      bg.querySelector('#delete-video').addEventListener('click', async () => {
        if (!confirm('Supprimer définitivement cette vidéo ?')) return;
        try {
          await api('DELETE', `/api/videos/${id}`);
          bg.remove();
          loadVideos();
        } catch (e) { alert(`Erreur : ${e.message}`); }
      });
    }

    document.body.appendChild(bg);
  }

  function openAddVideoModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Ajouter une vidéo</h2>
        <p style="font-size:13px; color:var(--text-muted);">YouTube, TikTok, Instagram (Reel/Post), Facebook</p>
        <label for="add-url">URL</label>
        <input type="url" id="add-url" placeholder="https://...">
        <button class="primary" id="submit-add" style="margin-top:12px; width:100%;">Ajouter</button>
        <div class="error" id="add-error"></div>
        <button class="subtle" id="cancel-add" style="width:100%; margin-top:8px;">Annuler</button>
      </div>
    `;
    document.body.appendChild(bg);
    const input = bg.querySelector('#add-url');
    input.focus();
    bg.querySelector('#cancel-add').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    bg.querySelector('#submit-add').addEventListener('click', async () => {
      const url = input.value.trim();
      if (!url) return;
      const err = bg.querySelector('#add-error');
      err.textContent = '';
      try {
        await api('POST', '/api/videos', { url });
        bg.remove();
        videosState.page = 1;
        videosState.filters.status = 'pas_valide';
        loadVideos();
      } catch (e) { err.textContent = e.message; }
    });
  }

  // --- Users view ---
  async function loadUsers() {
    const j = await api('GET', '/api/users');
    const v = document.getElementById('users-view');
    v.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-family:Cairo,serif; margin:0;">Utilisateurs (${j.items.length})</h2>
        <button class="primary" id="add-user-btn">+ Ajouter vérificateur</button>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Email</th><th>Nom</th><th>Rôle</th><th>Dernière connexion</th><th>Actif</th><th>Actions</th></tr></thead>
        <tbody id="user-tbody"></tbody>
      </table></div>
    `;
    const tbody = document.getElementById('user-tbody');
    for (const u of j.items) {
      const tr = document.createElement('tr');
      const isSelf = u.id === currentUser?.uid;
      const cells = [
        u.email, u.display_name, u.role,
        u.last_login_at || '—', u.active ? '✓' : '✗',
        isSelf ? '(vous)' : ''
      ];
      cells.forEach((c, i) => {
        const td = document.createElement('td');
        if (i < 5) td.textContent = c;
        tr.appendChild(td);
      });
      const actionsTd = tr.lastChild;
      if (!isSelf) {
        const toggle = document.createElement('button');
        toggle.className = 'subtle';
        toggle.textContent = u.active ? 'Désactiver' : 'Réactiver';
        toggle.addEventListener('click', async () => {
          await api('PATCH', `/api/users/${u.id}`, { active: !u.active });
          loadUsers();
        });
        actionsTd.appendChild(toggle);
        const del = document.createElement('button');
        del.className = 'danger';
        del.textContent = 'Supprimer';
        del.style.marginLeft = '6px';
        del.addEventListener('click', async () => {
          if (!confirm(`Supprimer définitivement ${u.email} ?`)) return;
          try { await api('DELETE', `/api/users/${u.id}`); loadUsers(); }
          catch (e) { alert(e.message); }
        });
        actionsTd.appendChild(del);
      } else {
        actionsTd.textContent = '(vous)';
      }
      tbody.appendChild(tr);
    }
    document.getElementById('add-user-btn').addEventListener('click', openAddUserModal);
  }

  function openAddUserModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Ajouter un vérificateur</h2>
        <label>Email <input type="email" id="u-email" required></label>
        <label>Nom <input type="text" id="u-name" required></label>
        <label>Mot de passe (min 8 caractères) <input type="password" id="u-pw" required minlength="8"></label>
        <button class="primary" id="u-submit" style="margin-top:12px; width:100%;">Créer</button>
        <div class="error" id="u-err"></div>
        <button class="subtle" id="u-cancel" style="width:100%; margin-top:8px;">Annuler</button>
      </div>
    `;
    document.body.appendChild(bg);
    bg.querySelector('#u-cancel').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    bg.querySelector('#u-submit').addEventListener('click', async () => {
      const err = bg.querySelector('#u-err'); err.textContent = '';
      try {
        await api('POST', '/api/users', {
          email: bg.querySelector('#u-email').value,
          display_name: bg.querySelector('#u-name').value,
          password: bg.querySelector('#u-pw').value,
          role: 'verificateur'
        });
        bg.remove(); loadUsers();
      } catch (e) { err.textContent = e.message; }
    });
  }

  // Auto-detect existing session
  api('GET', '/api/videos?per_page=1')
    .then(() => showApp({ uid: '?', role: 'admin' }))
    .catch(() => showLogin());
</script>
</body>
</html>
